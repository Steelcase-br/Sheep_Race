<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pantalla Pública - Borregos</title>
  <link rel="stylesheet" href="styles/styles.css" />
  <style>
    /* 🔧 Asegura que el lienzo tenga tamaño y sea referencia para #frases */
    html, body { height: 100%; margin: 0; }
    #pantalla-espectador {
      position: relative;     /* <- clave para posicionar #frases dentro */
      min-height: 100vh;      /* ocupa toda la altura de la ventana */
      overflow: hidden;       /* que no se salgan las frases */
    }
    /* 🔥 Capa de frases por encima del fondo/nubes/borregos */
    #frases {
      position: absolute;
      inset: 0;               /* top/right/bottom/left = 0 */
      z-index: 50;            /* mayor que otras capas; sube si hace falta */
      pointer-events: none;   /* no bloquea clics */
    }
    /* Animación usada en JS */
    @keyframes flotar {
      0%   { transform: translateY(10px); opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(-20px); opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="pantalla-espectador">
    <!-- Fondo de carrera -->
    <img src="assets/pantalla-espectador/fondo-carrera.svg" class="fondo" alt="Fondo carrera" />
    <img src="assets/pantalla-jugador/nube1.svg" alt="Nube" class="nube nube1" />
    <img src="assets/pantalla-jugador/nube2.svg" alt="Nube" class="nube nube2" />
    <img src="assets/pantalla-jugador/nube3.svg" alt="Nube" class="nube nube3" />

    <!-- 👇 Capa de frases -->
    <div id="frases"></div>

    <!-- Contenedor de borregos -->
    <div id="contenedor-borregos"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDapPU15NDHsuWxFhPELeqQBA3sYpey6LI",
      authDomain: "steelcase-juego.firebaseapp.com",
      databaseURL: "https://steelcase-juego-default-rtdb.firebaseio.com",
      projectId: "steelcase-juego",
      storageBucket: "steelcase-juego.appspot.com",
      messagingSenderId: "397340237973",
      appId: "1:397340237973:web:909ec0ffb18725f86e3b9c"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const contenedor = document.getElementById("contenedor-borregos");

    // Escuchar cambios en tiempo real
    db.ref("borregos").on("value", snapshot => {
      contenedor.innerHTML = "";
      const datos = snapshot.val();
      if (!datos) return;

      Object.values(datos).forEach(borrego => {
        if (borrego.estado === "vivo") {
          const div = document.createElement("div");
          div.classList.add("borrego-espectador");
          div.innerHTML = `
            <img src="assets/pantalla-espectador/borrego-jugador.svg" alt="Borrego" />
            <span style="color: ${borrego.color}">${borrego.nombre}</span>
          `;
          div.style.left = `${borrego.progreso}%`;
          div.style.bottom = "-360px";
          contenedor.appendChild(div);
        }
      });
    });
  </script>

  <audio id="bgm" src="assets/audio/winner.mp3" autoplay loop></audio>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const audio = document.getElementById("bgm");
      audio.play().catch(() => {
        console.warn("Autoplay bloqueado. Se activará al primer clic.");
        document.body.addEventListener("click", () => audio.play(), { once: true });
      });
    });
  </script>

  <script>
    function spawnFrases() {
      const cont = document.getElementById('frases');
      if (!cont) { console.warn('#frases no existe'); return; }

      const frases = [
        '¡Tú puedes!','¡No te rindas!','¡Dale con todo!','¡Vamos allá!',
        '¡Es tu momento!','¡Sigue así!','¡Eres imparable!','¡Dale, dale, dale!',
        '¡Casi lo logras!','¡No pares ahora!','¡Arriba ese ánimo!','¡A romperla!'
      ];

      cont.innerHTML = ''; // limpia por si se vuelve a llamar
      for (let i = 0; i < 12; i++) {
        const f = document.createElement('div');
        f.textContent = frases[Math.floor(Math.random() * frases.length)];

        // Estilos directos para asegurar visibilidad
        f.style.position = 'absolute';
        f.style.left = (Math.random() * 90) + '%';
        f.style.top = (Math.random() * 80) + '%';
        f.style.fontSize = (20 + Math.random() * 18) + 'px';
        f.style.fontWeight = '800';
        f.style.color = '#ffffff';
        f.style.textShadow = '0 2px 6px rgba(0,0,0,.45)';
        f.style.whiteSpace = 'nowrap';
        f.style.animation = 'flotar 2.2s ease-in-out infinite';
        f.style.animationDelay = (Math.random() * 1.2) + 's';

        cont.appendChild(f);
      }

      console.log('✅ Frases generadas:', cont.childElementCount);
    }

    window.addEventListener('DOMContentLoaded', () => {
      spawnFrases(); // ← aparece siempre, desde el inicio
    });
  </script>
</body>
</html>
